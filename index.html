<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>From the day I met you</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0b1220">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icon192.png" alt="" class="logo">
        <h1 data-i18n="appTitle">From the day<br>I met you</h1>
      </div>
      <div class="actions">
        <button id="addBtn" class="btn primary">+ Add</button>
        <button id="exportBtn" class="btn ghost">Export</button>
        <button id="importBtn" class="btn ghost">Import</button>
        <button id="langBtn" class="btn ghost" title="Change language">🌐</button>
        <button id="clearAllBtn" class="btn ghost">Delete all</button>
        <input type="file" id="importFile" accept=".json" hidden>
      </div>
    </header>

    <section class="intro">
      <p data-i18n="introText">Track the exact time since you met someone special. The counter updates live in decades, years, months, weeks, days, hours, minutes and seconds.</p>
    </section>

    <section id="list" class="list">
      <!-- counters injected here -->
    </section>

    <footer class="footer">
      <small data-i18n="footerText">Works offline as a PWA. Save multiple counters.</small>
      <div class="signature">Desarrollado por Oscar - 2026</div>
    </footer>
  </main>

  <!-- Add modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h2 id="modalTitle" data-i18n="modalTitle">Add new counter</h2>
      <form id="addForm">
        <label>
          <span data-i18n="nameLabel">Person's name</span>
          <input id="personName" type="text" required maxlength="60" placeholder="e.g. Ana">
        </label>
        <label>
          <span data-i18n="dateLabel">Date and time you met them</span>
          <input id="personDate" type="datetime-local" required>
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn primary" data-i18n="saveButton">Save</button>
          <button type="button" id="cancelBtn" class="btn ghost">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
