<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>From the day I met you</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0b1220">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icon192.png" alt="" class="logo">
        <h1 data-i18n="appTitle">From the day<br>I met you</h1>
      </div>
      <div class="actions">
        <button id="addBtn" class="btn primary"></button>
        <button id="exportBtn" class="btn ghost"></button>
        <button id="importBtn" class="btn ghost"></button>
        <button id="langBtn" class="btn ghost"></button>
        <button id="clearAllBtn" class="btn ghost"></button>
        <input type="file" id="importFile" accept=".json" hidden>
      </div>
    </header>
    <section class="intro"><p data-i18n="introText"></p></section>
    <section id="list" class="names"></section>
    <footer class="footer">
      <small data-i18n="footerText"></small>
      <div class="signature">Desarrollado por Oscar - 2026</div>
    </footer>
  </main>

  <!-- Formulario reutilizable (persona / marcador) -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <form id="addForm">
        <label><span id="nameLabel"></span><input id="personName" type="text" required maxlength="60"></label>
        <label><span id="dateLabel"></span><input id="personDate" type="datetime-local" required></label>
        <label id="relWrap"><span id="relLabel"></span><input id="personRel" type="text" maxlength="40"></label>
        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn ghost"></button>
          <button type="submit" class="btn primary" data-i18n="saveButton"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Panel de detalle -->
  <div id="detail" class="modal hidden" role="dialog" aria-modal="true">
    <article class="sheet" id="sheet"></article>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
